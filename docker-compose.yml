version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mold-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mold123456
      MYSQL_DATABASE: mold_management
      MYSQL_USER: mold
      MYSQL_PASSWORD: mold123456
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pmold123456 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mold-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mold-backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: mold
      DB_PASSWORD: mold123456
      DB_NAME: mold_management
      SECRET_KEY: mold-management-secret-key-2024-docker
      DOCKER_ENV: "1"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mold-network

  nginx:
    image: nginx:alpine
    container_name: mold-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - mold-network

volumes:
  mysql_data:

networks:
  mold-network:
    driver: bridge
